services:
  discord-bot:
    image: meoxp-bot:${TAG:-meoxpbot}
    build:
      context: .
      labels:
        - "com.meoxp.bot.project=meoxp-bot"
        - "com.meoxp.bot.service=discord-bot"
    container_name: meoxp-discord-bot
    restart: unless-stopped
    labels:
      - "com.meoxp.bot.project=meoxp-bot"
      - "com.meoxp.bot.service=discord-bot"
    env_file:
      - .env
    ports:
      - "4444:80"
      - "4000:4000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - default
      - lavalink_lavalink-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => r.status < 400 ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  dashboard:
    image: meoxp-dashboard:${TAG:-meoxpbot}
    build:
      context: ./dashboard
      args:
        # NEXT_PUBLIC_ vars must be set at build time for Next.js
        # This is the external URL that browser uses to access bot API
        NEXT_PUBLIC_BOT_API_URL: https://botapi.meo.in.th
      labels:
        - "com.meoxp.bot.project=meoxp-bot"
        - "com.meoxp.bot.service=dashboard"
    container_name: meoxp-dashboard
    restart: unless-stopped
    labels:
      - "com.meoxp.bot.project=meoxp-bot"
      - "com.meoxp.bot.service=dashboard"
    ports:
      - "3001:3000"
    environment:
      - BOT_API_URL=http://discord-bot:4000
    depends_on:
      discord-bot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => r.status < 400 ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  tts-service:
    image: gnomeddev/tts-service
    container_name: meoxp-tts-service
    restart: unless-stopped
    labels:
      - "com.meoxp.bot.project=meoxp-bot"
      - "com.meoxp.bot.service=tts-service"
    volumes:
      - ./gcp.dummy.json:/gcp.json:ro
    environment:
      - IPV6_BLOCK=DISABLE
      - LOG_LEVEL=INFO
      - BIND_ADDR=0.0.0.0:20310
      - GOOGLE_APPLICATION_CREDENTIALS=/gcp.json
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dummy}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-dummy}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    ports:
      - "20310:20310"
    networks:
      - default
      - lavalink_lavalink-net

networks:
  lavalink_lavalink-net:
    external: true
